name: TEST beta source checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up tested Bun version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Verify exact source and local document targets before build
        run: bun scripts/release-import-audit.mjs
      - name: Verify SQL artifacts without a database
        run: bun scripts/promotion-release-package.mjs --verify
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build with provider workflows unconfigured
        run: bun run build
      - name: Check full and runtime types
        run: |
          bun run typecheck
          bun run typecheck:runtime
      - name: Ensure install did not rewrite the lockfile
        run: git diff --exit-code -- bun.lock
