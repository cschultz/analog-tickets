name: Checkout Flow Tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/create-cosmico-checkout/**'
      - 'supabase/functions/stripe-webhook/**'
      - 'supabase/functions/verify-payment/**'
      - 'src/components/tickets/**'
      - '.github/workflows/checkout-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/create-cosmico-checkout/**'
      - 'supabase/functions/stripe-webhook/**'
      - 'supabase/functions/verify-payment/**'
      - 'src/components/tickets/**'
  schedule:
    # Run daily at 8am UTC to catch any infrastructure issues
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  edge-function-tests:
    name: Edge Function Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run checkout edge function tests
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            supabase/functions/create-cosmico-checkout/index_test.ts

      - name: Run lodging inventory tests
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            supabase/functions/create-self-service-lodging/index_test.ts

  checkout-health-check:
    name: Checkout Endpoint Health Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Check checkout endpoint is responsive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Test that the endpoint responds (even with invalid data, it should return 400, not 500)
          RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/response.json \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -d '{"ticketType":"invalid","quantity":1,"name":"Health Check","email":"healthcheck@test.com"}' \
            "$SUPABASE_URL/functions/v1/create-cosmico-checkout")
          
          echo "Response code: $RESPONSE"
          cat /tmp/response.json
          
          # 400 is expected for invalid data, 500 means something is broken
          if [ "$RESPONSE" = "500" ]; then
            echo "❌ Checkout endpoint returned 500 - something is broken!"
            exit 1
          fi
          
          echo "✅ Checkout endpoint is healthy (returned $RESPONSE)"

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [edge-function-tests, checkout-health-check]
    if: failure()
    
    steps:
      - name: Create failure notification
        run: |
          echo "🚨 Checkout tests failed! Check GitHub Actions for details."
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
